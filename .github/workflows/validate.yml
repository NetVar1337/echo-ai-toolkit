name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Echo ships patches on its own schedule. Check weekly so the toolkit cannot
  # go stale silently between commits.
  schedule:
    - cron: '0 7 * * 1'

jobs:
  json:
    name: JSON validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON files
        run: |
          fail=0
          for f in \
            .mcp.json \
            .claude-plugin/plugin.json \
            .claude-plugin/marketplace.json \
            hooks/hooks.json; do
            if python3 -c "import json,sys; json.load(open('$f'))" 2>&1; then
              echo "OK  $f"
            else
              echo "FAIL $f"
              fail=1
            fi
          done
          exit $fail

  api:
    name: Echo API conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch authoritative Echo API reference
        run: |
          curl -fsSL https://echo-23.gitbook.io/angel/llms-full.txt -o /tmp/echo-llms-full.txt
          test -s /tmp/echo-llms-full.txt

      - name: Build API signature index
        run: python3 scripts/build_api_index.py /tmp/echo-llms-full.txt -o /tmp/echo-api-index.json

      - name: Check docs teach only the real API
        run: python3 scripts/check_api.py --root . --api-index /tmp/echo-api-index.json

      - name: Check the compile stub matches the real API
        run: python3 scripts/check_api.py --root . --api-index /tmp/echo-api-index.json --stub scripts/angelscript/echo_stub.as

  drift:
    name: Echo docs drift
    # The guard above runs when you push. Echo does not. This one runs weekly and
    # files an issue when the live docs no longer match what the repo teaches.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live docs and rebuild the index
        run: |
          curl -fsSL https://echo-23.gitbook.io/angel/llms-full.txt -o /tmp/echo-llms-full.txt
          test -s /tmp/echo-llms-full.txt
          python3 scripts/build_api_index.py /tmp/echo-llms-full.txt -o /tmp/echo-api-index.json

      - name: Compare the repo against the live docs
        id: check
        run: |
          if python3 scripts/check_api.py --root . \
               --api-index /tmp/echo-api-index.json \
               --stub scripts/angelscript/echo_stub.as > /tmp/drift.txt 2>&1; then
            echo "status=0" >> "$GITHUB_OUTPUT"
          else
            echo "status=1" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/drift.txt

      - name: File the drift issue
        if: steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Echo docs drifted from the toolkit'
          {
            printf 'The weekly check against https://echo-23.gitbook.io/angel/llms-full.txt failed.\n\n'
            printf '```\n%s\n```\n' "$(tail -n 60 /tmp/drift.txt)"
          } > /tmp/body.md
          n=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file /tmp/body.md
          else
            gh issue create --title "$title" --body-file /tmp/body.md || gh issue create --title "$title" --body-file /tmp/body.md
          fi

      - name: Close the drift issue once clean
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='Echo docs drifted from the toolkit'
          for n in $(gh issue list --state open --search "$title in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --comment 'The live docs match the repo again.'
          done

  vendor:
    name: Vendored tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: vendor/ matches MANIFEST.json
        run: python3 scripts/vendor_manifest.py --check

      - name: Every vendored file is tracked
        run: |
          # A file ignored by a vendored upstream .gitignore would be missing from
          # a fresh clone and from the tarball the installer fetches.
          tracked=$(git ls-files vendor | wc -l)
          ondisk=$(find vendor -type f | wc -l)
          echo "tracked $tracked / on disk $ondisk"
          if [ "$tracked" -ne "$ondisk" ]; then
            comm -13 <(git ls-files vendor | sort) <(find vendor -type f | sort) | head -20
            echo "FAIL: vendored files are untracked (git add -f them)"; exit 1
          fi

      - name: Every expected tree is vendored
        run: |
          fail=0
          for d in mcp/angel-menu-mcp tools/VTIL-Core tools/NoVmp tools/vtil2 \
                   tools/vmp-lazy-unpack tools/VMProtect-devirtualization tools/web-mv \
                   plugins/ponytail plugins/andrej-karpathy-skills \
                   bin scripts docs npm python; do
            [ -e "vendor/$d" ] || { echo "FAIL vendor/$d missing"; fail=1; }
          done
          [ -s vendor/ARCHIVES ] || { echo "FAIL vendor/ARCHIVES missing (mcp-gamehacking archive)"; fail=1; }
          exit $fail

      - name: Installers reach nothing but this repo and pinned registries
        run: |
          fail=0
          # Comments are allowed to mention any URL; only real fetches matter.
          allowed='^(codeload\.github\.com|github\.com|bun\.sh|pi\.dev|claude\.com|pypi\.org|registry\.npmjs\.org|127\.0\.0\.1)$'
          for f in install.sh install.ps1; do
            hosts=$(grep -vE '^\s*#' "$f" | grep -ohE 'https?://[A-Za-z0-9._-]+' | sed -E 's#https?://##' | sort -u)
            for host in $hosts; do
              if echo "$host" | grep -qE "$allowed"; then
                echo "OK   $f -> $host"
              else
                echo "FAIL $f fetches $host"; fail=1
              fi
            done
          done
          exit $fail

  layout:
    name: Plugin layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agents and skills are in plugin-loadable locations
        run: |
          fail=0
          # Claude Code loads plugin agents from agents/ and skills from skills/<name>/SKILL.md
          for f in agents/*.md; do
            [ -e "$f" ] || continue
            grep -q '^name:' "$f" || { echo "FAIL $f: missing frontmatter 'name:'"; fail=1; }
            grep -q '^description:' "$f" || { echo "FAIL $f: missing frontmatter 'description:'"; fail=1; }
          done
          for d in skills/*/; do
            n=$(basename "$d")
            [ -f "$d/SKILL.md" ] || { echo "FAIL $d: no SKILL.md"; fail=1; continue; }
            grep -q '^name:' "$d/SKILL.md" || { echo "FAIL $d/SKILL.md: missing frontmatter 'name:'"; fail=1; }
            grep -q '^description:' "$d/SKILL.md" || { echo "FAIL $d/SKILL.md: missing frontmatter 'description:'"; fail=1; }
          done
          # every agent file must have a matching slash command registered in the hook
          for f in agents/*.md; do
            n=$(basename "$f" .md)
            grep -q "'$n'" hooks/register.tsx || { echo "FAIL agent '$n' is not registered in hooks/register.tsx"; fail=1; }
          done
          exit $fail

  angelscript:
    name: AngelScript compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the AngelScript checker
        run: ./scripts/angelscript/build.sh

      - name: Compile every template and check the doc code blocks
        run: |
          python3 scripts/check_angelscript.py \
            --root . \
            --checker "$PWD/scripts/angelscript/check" \
            --workdir "$RUNNER_TEMP"

  pi-profile:
    name: Pi profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prompt files exist and are non-empty
        run: |
          fail=0
          for f in pi/SYSTEM.md pi/APPEND_SYSTEM.md pi/AGENTS.md; do
            if [ -s "$f" ]; then echo "OK   $f ($(wc -c < "$f") bytes)"; else echo "FAIL $f missing or empty"; fail=1; fi
          done
          exit $fail

      - name: Every prompt template has frontmatter
        run: |
          fail=0
          for f in pi/prompts/*.md; do
            [ -e "$f" ] || continue
            head -1 "$f" | grep -q '^---$' || { echo "FAIL $f: no frontmatter"; fail=1; continue; }
            grep -q '^description:' "$f" || { echo "FAIL $f: no description"; fail=1; continue; }
            echo "OK   $f"
          done
          exit $fail

      - name: Skills port to Pi's SKILL.md format
        run: |
          fail=0
          n=0
          for d in skills/*/; do
            f="$d/SKILL.md"
            [ -f "$f" ] || { echo "FAIL $d: no SKILL.md"; fail=1; continue; }
            grep -q '^name:' "$f" || { echo "FAIL $f: no name"; fail=1; continue; }
            grep -q '^description:' "$f" || { echo "FAIL $f: no description"; fail=1; continue; }
            n=$((n+1))
          done
          echo "$n skills are Pi-compatible (name + description frontmatter)"
          exit $fail

      - name: CLI is syntactically valid and doctor runs
        run: |
          node --check scripts/echo.mjs
          echo "OK   scripts/echo.mjs parses"
          ECHO_HOME=/tmp/nonexistent node scripts/echo.mjs doctor > /tmp/doctor.txt
          grep -q 'Pinned tools' /tmp/doctor.txt || { echo "FAIL: doctor output incomplete"; exit 1; }
          echo "OK   echo doctor runs with no install present"

      - name: Launcher refuses cleanly without pi
        run: |
          chmod +x pi/bin/echo
          out=$(ECHO_HOME=/nonexistent PATH=/usr/bin:/bin pi/bin/echo 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'pi.*is not installed' || { echo "FAIL: no install hint"; exit 1; }

      - name: Wrapper subcommands dispatch
        run: |
          chmod +x pi/bin/echo
          fail=0
          for cmd in help version status tools; do
            if ECHO_HOME=/tmp/nonexistent pi/bin/echo "$cmd" >/dev/null 2>&1; then
              echo "OK   echo $cmd"
            else
              echo "FAIL echo $cmd"; fail=1
            fi
          done
          if bash scripts/echo-update.sh --nonsense >/dev/null 2>&1; then
            echo "FAIL echo update --nonsense should exit non-zero"; fail=1
          else
            echo "OK   echo update rejects unknown flags"
          fi
          exit $fail

      - name: Update flag routing
        run: |
          stub=$(mktemp -d)
          printf '#!/bin/sh\necho "PI: $*"\n' > "$stub/pi"
          printf '#!/bin/sh\necho "CLAUDE: $*"\n' > "$stub/claude"
          chmod +x "$stub/pi" "$stub/claude"
          for f in --extensions --self --models --all; do
            out=$(PATH="$stub:$PATH" ECHO_HOME=/tmp/nonexistent bash scripts/echo-update.sh "$f" 2>&1 | sed 's/\x1b\[[0-9;]*m//g')
            echo "$out" | grep -q "PI: update $f" || { echo "FAIL: $f not forwarded to pi"; exit 1; }
            echo "OK   $f -> pi update $f"
          done
          out=$(PATH="$stub:$PATH" ECHO_HOME=/tmp/nonexistent bash scripts/echo-update.sh --self 2>&1 | sed 's/\x1b\[[0-9;]*m//g')
          if echo "$out" | grep -q 'Toolkit plugin'; then
            echo "FAIL: --self should not touch the toolkit"; exit 1
          fi
          echo "OK   --self leaves the toolkit alone"

  plugin:
    name: Plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest
        run: claude plugin validate .

      - name: Run plugin hook tests
        run: claude plugin test .

  installers:
    name: Installer syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every shell script parses
        run: |
          fail=0
          for f in install.sh scripts/*.sh scripts/angelscript/*.sh; do
            [ -f "$f" ] || continue
            if bash -n "$f"; then echo "OK   $f"; else echo "FAIL $f"; fail=1; fi
          done
          exit $fail

      - name: Every PowerShell script parses
        shell: pwsh
        run: |
          $fail = 0
          $files = @('install.ps1') + (Get-ChildItem scripts -Filter *.ps1 -Recurse | ForEach-Object { $_.FullName })
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { continue }
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) {
              Write-Host "FAIL $f"
              $errors | ForEach-Object { Write-Host "  $($_.Message) at line $($_.Extent.StartLineNumber)" }
              $fail = 1
            } else { Write-Host "OK   $f" }
          }
          exit $fail

      - name: tools.lock is well formed
        run: |
          fail=0
          n=0
          while read -r kind name ref pin; do
            case "$kind" in
              \#*|"") continue ;;
              clone)
                echo "$pin" | grep -qE '^[0-9a-f]{40}$' || { echo "FAIL clone $name: pin is not a commit sha"; fail=1; }
                echo "$ref"  | grep -qE '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' || { echo "FAIL clone $name: ref is not owner/repo"; fail=1; } ;;
              raw|asset)
                echo "$pin" | grep -qE '^[0-9a-f]{64}$' || { echo "FAIL $kind $name: pin is not a sha256"; fail=1; }
                echo "$ref" | grep -qE '^https://' || { echo "FAIL $kind $name: ref is not a URL"; fail=1; } ;;
              npm|pip|toolver)
                [ -n "$pin" ] || { echo "FAIL $kind $name: no version"; fail=1; } ;;
              *) echo "FAIL unknown kind: $kind"; fail=1 ;;
            esac
            n=$((n+1))
          done < tools.lock
          echo "$n pins validated"
          exit $fail

      - name: The mcp-gamehacking archive parts are reachable
        run: |
          fail=0
          grep -vE '^\s*#|^\s*$' vendor/ARCHIVES | awk '{print $2}' > /tmp/parts.txt
          [ -s /tmp/parts.txt ] || { echo "FAIL vendor/ARCHIVES lists no parts"; exit 1; }
          while read -r url; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
            if [ "$code" = "200" ]; then echo "OK   $url"; else echo "FAIL $url ($code)"; fail=1; fi
          done < /tmp/parts.txt
          exit $fail

